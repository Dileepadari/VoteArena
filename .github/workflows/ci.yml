name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, test and build - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 20.11, so the floor runs too.
        node: ["20.11", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      # The web and server halves have separate tsconfigs. Running only one
      # leaves the other unchecked, which is why the script runs both.
      - run: npm run typecheck

      # --coverage.thresholds is what turns a collection error into a red build:
      # vitest exits 0 having run nothing, and the coverage number is the only
      # thing that notices.
      - name: Tests with a coverage floor
        run: >
          npx vitest run --coverage
          --coverage.thresholds.lines=85 --coverage.thresholds.functions=85

      - run: npm run build

  e2e:
    name: End to end against the built server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Playwright boots `dist/server/server/index.js`, so the suite exercises
      # the real production server and the real static-file handling, not the
      # dev server. That means the build has to happen first.
      - run: npm run build

      - run: npx playwright test

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # The runtime tree is six packages, so an advisory there is a real one and
      # the bar is every severity. `qs` reaches this tree only through express,
      # which pins an affected range, so package.json carries an override.
      - name: Production dependencies, no advisories at all
        run: npm audit --omit=dev --audit-level=low

      - name: Whole tree, nothing high or critical
        run: npm audit --audit-level=high

  hygiene:
    name: Plain ASCII and no tracked build output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No em dashes, arrows or dingbats
        run: |
          if git ls-files -z \
              | xargs -0 grep -nP '[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}\x{2190}-\x{21FF}\x{2014}\x{2013}\x{FE0F}]' \
                --binary-files=without-match; then
            echo "Found an em dash, en dash, arrow or dingbat. Use -, -> or plain words."
            exit 1
          fi
          echo "clean"

      # The same characters written as HTML entities are pure ASCII on disk and
      # render as exactly what the rule removes, so the grep above cannot see them.
      - name: No entity form of the same characters
        run: |
          if git ls-files -z \
              | xargs -0 grep -nP '&(mdash|ndash|rarr|larr|harr|rArr|lArr|#821[123469]|#x201[34]|#8594|#8592|#x219[02]);' \
                --binary-files=without-match; then
            echo "Found an entity that renders as an em dash, en dash or arrow."
            exit 1
          fi
          echo "clean"

      - name: No build output, database or capture harness is tracked
        run: |
          if git ls-files | grep -E '^(node_modules|dist|coverage|playwright-report|test-results)/|\.env$|\.db$|__capture\.html$'; then
            echo "Build output, a database, a .env or a capture harness is tracked."
            exit 1
          fi
          echo "clean"

  readme-pair:
    name: README-light.md is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Regenerate and compare
        run: |
          node scripts/build-light-readme.mjs
          git diff --exit-code README-light.md

      - name: Every local image referenced by either README exists
        run: |
          missing=0
          for f in $(grep -ho 'src="[^"]*"' README.md README-light.md \
                     | sed 's/^src="//; s/"$//; s|^\./||' | grep -v '^https\?://' | sort -u); do
            if [ ! -f "$f" ]; then
              echo "missing: $f"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "every referenced image exists"
